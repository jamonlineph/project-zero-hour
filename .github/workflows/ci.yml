name: CI

on:
  push:
    branches: [main, "claude/**", "task/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  repo-checks:
    name: Repo checks (provenance, banned files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/check_repo.py

  godot-tests:
    name: Godot tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download Godot
        run: tools/ci/download_godot.sh
      - name: Run unit and smoke tests
        run: GODOT="$PWD/godot-bin" tools/run_tests.sh
      - name: Performance harness (fails on a regression over 20%)
        run: GODOT="$PWD/godot-bin" tools/run_perf.sh
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: build/perf/latest.json
          if-no-files-found: ignore

  builds:
    name: Builds (Android debug APK, Linux, Windows)
    needs: [repo-checks, godot-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to attach builds to a release on v* tags
    steps:
      - uses: actions/checkout@v5
      - name: Download Godot and export templates
        run: tools/ci/download_godot.sh --templates
      - name: Export all presets
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          # Throwaway debug keystore, made fresh on every run. Release keys never live in the repo.
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          GODOT="$PWD/godot-bin" tools/export_builds.sh
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/android/
      - name: Upload desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: desktop-builds
          path: |
            build/linux/
            build/windows/
      - name: Attach builds to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          zip -qr "project-zero-hour-linux-${GITHUB_REF_NAME}.zip" linux
          zip -qr "project-zero-hour-windows-${GITHUB_REF_NAME}.zip" windows
          cp android/project-zero-hour-debug.apk "project-zero-hour-android-debug-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease \
            "project-zero-hour-linux-${GITHUB_REF_NAME}.zip" \
            "project-zero-hour-windows-${GITHUB_REF_NAME}.zip" \
            "project-zero-hour-android-debug-${GITHUB_REF_NAME}.apk"
