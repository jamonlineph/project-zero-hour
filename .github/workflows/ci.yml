name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-checks:
    name: Repo checks (provenance, banned files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/check_repo.py

  godot-tests:
    name: Godot tests (headless)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v5
      - name: Download Godot
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot-bin
          chmod +x godot-bin
      - name: Run unit and smoke tests
        run: GODOT="$PWD/godot-bin" tools/run_tests.sh
